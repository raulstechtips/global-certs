{{- range .Values.wildcardCertificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "global-certs-wrapper.labels" $ | nindent 4 }}
spec:
  commonName: {{ printf "*.%s" .domain | quote }}
  dnsNames:
    - {{ .domain | quote }}
    - {{ printf "*.%s" .domain | quote }}
  secretName: {{ .secretName }}
  issuerRef:
    name: {{ .issuer }}
    kind: ClusterIssuer
  secretTemplate:
    {{- toYaml $.Values.secretTemplate | nindent 4 }}
{{- end }}
