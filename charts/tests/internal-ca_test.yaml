suite: Internal CA certificate
templates:
  - templates/internal-ca.yaml
release:
  name: global-certs
  namespace: cert-manager
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: preserves the CA identity and key settings
    values: [../ci/all-on-values.yaml]
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: fake-internal-ca
      - equal:
          path: metadata.namespace
          value: cert-manager
      - equal:
          path: spec
          value:
            isCA: true
            commonName: ca.example.test
            secretName: fake-internal-ca-key-pair
            privateKey: {algorithm: ECDSA, size: 256}
            issuerRef: {name: fake-selfsigned-issuer, kind: ClusterIssuer}
            secretTemplate:
              annotations:
                reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
                reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
